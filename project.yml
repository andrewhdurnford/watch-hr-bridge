name: WatchHRBridge
options:
  bundleIdPrefix: com.andrewdurnford
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    # DEVELOPMENT_TEAM is passed on the command line (see README); tools/archive.sh does it for releases.
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HRBridgeWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    entitlements:
      path: Watch/HRBridgeWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewdurnford.watchhrbridge
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Watch/HRBridgeWatch-Bridging-Header.h
        INFOPLIST_KEY_CFBundleDisplayName: "HR Bridge"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads your heart rate during a workout so it can be shared as a Bluetooth heart rate sensor."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Starts a cycling workout session so your watch measures heart rate continuously. Nothing is saved to Health."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Shares your heart rate as a Bluetooth heart rate sensor so apps like Zwift can read it."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes: [workout-processing]
        ITSAppUsesNonExemptEncryption: false
schemes:
  HRBridgeWatch:
    build:
      targets:
        HRBridgeWatch: all
    run:
      config: Debug
